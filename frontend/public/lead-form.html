<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .form-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
    .form-container h2 { color: #1B3A6B; margin-bottom: 8px; font-size: 24px; }
    .form-container p { color: #666; margin-bottom: 24px; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; color: #444; font-size: 14px; margin-bottom: 6px; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #2E75B6; }
    button { width: 100%; padding: 12px; background: #1B3A6B; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2E75B6; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-top: 16px; text-align: center; display: none; }
    .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-top: 16px; text-align: center; display: none; }
    .powered { text-align: center; margin-top: 16px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Contact Us</h2>
    <p>Fill the form below and we will get back to you shortly.</p>

    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" id="name" placeholder="Your full name" required />
    </div>

    <div class="form-group">
      <label>Phone Number *</label>
      <input type="tel" id="phone" placeholder="Your mobile number" required />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Your email address" />
    </div>

    <div class="form-group">
      <label>How did you hear about us?</label>
      <select id="source">
        <option value="Website">Website</option>
        <option value="Google">Google</option>
        <option value="Facebook">Facebook</option>
        <option value="Instagram">Instagram</option>
        <option value="Referral">Referral</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Message</label>
      <textarea id="notes" rows="3" placeholder="Tell us about your requirements..."></textarea>
    </div>

    <button id="submitBtn" onclick="submitLead()">Submit Enquiry</button>

    <div class="success" id="successMsg">
      ✅ Thank you! We will contact you shortly.
    </div>
    <div class="error" id="errorMsg">
      ❌ Something went wrong. Please try again.
    </div>

    <p class="powered">Powered by Lynx Soft. CRM</p>
  </div>

  <script>
    async function submitLead() {
      const name = document.getElementById('name').value.trim()
      const phone = document.getElementById('phone').value.trim()
      const email = document.getElementById('email').value.trim()
      const source = document.getElementById('source').value
      const notes = document.getElementById('notes').value.trim()

      if (!name || !phone) {
        alert('Name aur Phone zaruri hai!')
        return
      }

      const btn = document.getElementById('submitBtn')
      btn.disabled = true
      btn.textContent = 'Submitting...'

      try {
        const response = await fetch('https://onmlidhccemitouzgmzb.supabase.co/functions/v1/capture-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email, source, notes })
        })

        const data = await response.json()

        if (response.ok) {
          document.getElementById('successMsg').style.display = 'block'
          document.getElementById('errorMsg').style.display = 'none'
          document.getElementById('name').value = ''
          document.getElementById('phone').value = ''
          document.getElementById('email').value = ''
          document.getElementById('notes').value = ''
        } else {
          document.getElementById('errorMsg').style.display = 'block'
          document.getElementById('successMsg').style.display = 'none'
        }
      } catch (err) {
        document.getElementById('errorMsg').style.display = 'block'
      }

      btn.disabled = false
      btn.textContent = 'Submit Enquiry'
    }
  </script>
</body>
</html>
